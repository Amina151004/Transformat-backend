<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed — Transformat</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #a7e8fd, #218cde);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    text-align: center;
  }
  .icon { font-size: 44px; margin-bottom: 16px; }
  h1 {
    font-size: 22px;
    color: #111827;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
    margin: 0;
  }
  .errorText { color: #dc2626; }
</style>
</head>
<body>

<div class="card" id="card">
  <!-- Filled in by script below depending on success/error -->
</div>

<script>
  // Supabase appends ?error=...&error_description=... to the redirect
  // URL if verification failed (expired/used link). On success it
  // redirects here with no error params -- confirmation already
  // happened server-side before the browser ever got here, so this
  // page doesn't need to call Supabase itself, just read the URL.
  const params = new URLSearchParams(window.location.search);
  const error = params.get('error_description') || params.get('error');

  const card = document.getElementById('card');

  if (error) {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>Link expired or already used</h1>
      <p class="errorText">${error.replace(/\+/g, ' ')}</p>
      <p style="margin-top: 14px;">Go back to the Transformat app and try signing up again, or request a new confirmation email.</p>
    `;
  } else {
    card.innerHTML = `
      <div class="icon">✅</div>
      <h1>Email confirmed</h1>
      <p>Your Transformat account is ready. Go back to the app and log in.</p>
    `;
  }
</script>

</body>
</html>
