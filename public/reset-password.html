<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Transformat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #a7e8fd, #218cde);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  }
  h1 {
    font-size: 22px;
    color: #111827;
    margin: 0 0 6px;
  }
  p.subtitle {
    font-size: 13.5px;
    color: #6b7280;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    font-size: 12.5px;
    color: #374151;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #218cde; }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #a7e8fd, #218cde);
    color: white;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
    line-height: 1.5;
  }
  .msg.error { color: #dc2626; }
  .msg.success { color: #16a34a; }
  .hint { font-size: 11px; color: #9ca3af; margin: -10px 0 16px; }
  #successState { display: none; text-align: center; }
  #successState .icon { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="card">
  <div id="formState">
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a new password for your Transformat account.</p>

    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 8 characters" />

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" placeholder="Re-enter your password" />
    <p class="hint">Must include an uppercase letter, a lowercase letter, and a number.</p>

    <button id="submitBtn" onclick="handleSubmit()">Update password</button>
    <div id="message" class="msg"></div>
  </div>

  <div id="successState">
    <div class="icon">✅</div>
    <h1>Password updated</h1>
    <p class="subtitle">You can now go back to the Transformat app and log in with your new password.</p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://kiitejjtnoqeffltjaln.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_J4PqhyEey5Qmkhd-HFWpgw_5pt2TSYB';

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'msg ' + type;
  }

  function isStrongPassword(pw) {
    return pw.length >= 8 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /[0-9]/.test(pw);
  }

  // Supabase redirects here with the recovery session encoded in the
  // URL hash (#access_token=...&refresh_token=...&type=recovery).
  // The SDK's detectSessionInUrl (on by default) picks this up
  // automatically on client init, so no manual parsing is needed --
  // we just wait for the auth event to confirm it landed.
  let recoveryReady = false;

  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
    }
  });

  // Fallback: if the event already fired before this listener attached,
  // check for an existing session directly.
  client.auth.getSession().then(({ data }) => {
    if (data.session) recoveryReady = true;
  });

  async function handleSubmit() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!password || !confirm) {
      showMessage('Please fill in both fields.', 'error');
      return;
    }
    if (!isStrongPassword(password)) {
      showMessage('Password must be 8+ characters with upper, lower, and a number.', 'error');
      return;
    }
    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }
    if (!recoveryReady) {
      showMessage('This link appears invalid or expired. Please request a new reset email.', 'error');
      return;
    }

    submitBtn.disabled = true;
    showMessage('Updating...', '');

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      submitBtn.disabled = false;
      showMessage(error.message || 'Something went wrong. Try again.', 'error');
      return;
    }

    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
  }
</script>

</body>
</html>
